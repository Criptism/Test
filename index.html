<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bot Deploy Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #0f1117; color: #eee; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 16px; font-size: 0.9rem; color: #aaa; }
  input[type=text], input[type=password] {
    width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px;
    border: 1px solid #333; background: #1a1d27; color: #eee; box-sizing: border-box;
  }
  #dropzone {
    margin-top: 8px; border: 2px dashed #444; border-radius: 8px; padding: 30px;
    text-align: center; color: #888; cursor: pointer;
  }
  #dropzone.dragover { border-color: #6c8cff; color: #6c8cff; }
  #fileList { margin-top: 8px; font-size: 0.85rem; color: #9c9; }
  .env-row { display: flex; gap: 8px; margin-top: 8px; }
  .env-row input { flex: 1; }
  #addEnv { margin-top: 8px; background: #2a2d3a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #deployBtn { margin-top: 24px; width: 100%; padding: 12px; background: #6c8cff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  #deployBtn:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 16px; font-size: 0.9rem; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Deploy a Discord Bot</h1>

<label>Bot name (used as its folder name, letters/numbers/-/_ only)</label>
<input type="text" id="botName" placeholder="my-cool-bot">

<label>Bot code files</label>
<div id="dropzone">Drag files here, or click to browse</div>
<input type="file" id="fileInput" multiple style="display:none">
<div id="fileList"></div>

<label>Discord Token</label>
<input type="password" id="token" placeholder="paste token here">

<label>Extra environment variables</label>
<div id="envRows"></div>
<button id="addEnv">+ Add variable</button>

<label>Receiver URL (your Oracle VM)</label>
<input type="text" id="receiverUrl" placeholder="http://your-vm-ip:8000" value="http://your-vm-ip:8000">

<label>API Key (must match DEPLOY_API_KEY on the server)</label>
<input type="password" id="apiKey" placeholder="the shared secret">

<button id="deployBtn">Deploy Bot</button>
<div id="result"></div>

<script>
let selectedFiles = [];

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(fileListObj) {
  for (const f of fileListObj) selectedFiles.push(f);
  fileList.textContent = selectedFiles.map(f => f.name).join(', ');
}

document.getElementById('addEnv').addEventListener('click', () => {
  const row = document.createElement('div');
  row.className = 'env-row';
  row.innerHTML = `
    <input type="text" placeholder="KEY" class="envKey">
    <input type="text" placeholder="value" class="envValue">
  `;
  document.getElementById('envRows').appendChild(row);
});

document.getElementById('deployBtn').addEventListener('click', async () => {
  const btn = document.getElementById('deployBtn');
  const resultEl = document.getElementById('result');
  const botName = document.getElementById('botName').value.trim();
  const token = document.getElementById('token').value.trim();
  const receiverUrl = document.getElementById('receiverUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();

  if (!botName || !token || selectedFiles.length === 0 || !receiverUrl || !apiKey) {
    resultEl.textContent = 'Fill in bot name, token, files, receiver URL, and API key.';
    return;
  }

  const envVars = {};
  document.querySelectorAll('.env-row').forEach(row => {
    const k = row.querySelector('.envKey').value.trim();
    const v = row.querySelector('.envValue').value.trim();
    if (k) envVars[k] = v;
  });

  const formData = new FormData();
  formData.append('bot_name', botName);
  formData.append('discord_token', token);
  formData.append('env_vars_json', JSON.stringify(envVars));
  selectedFiles.forEach(f => formData.append('files', f));

  btn.disabled = true;
  resultEl.textContent = 'Deploying...';

  try {
    const res = await fetch(`${receiverUrl}/deploy`, {
      method: 'POST',
      headers: { 'x-api-key': apiKey },
      body: formData
    });
    const data = await res.json();
    resultEl.textContent = res.ok
      ? `Deployed! PID: ${data.pid}`
      : `Error: ${data.detail || JSON.stringify(data)}`;
  } catch (err) {
    resultEl.textContent = `Request failed: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
